<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulador de atendimento</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --green: #075e54;
      --green-light: #25d366;
      --paper: #efeae2;
      --ink: #17212b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #d8eee7, #f6f1e8 55%, #d9e7ef);
      color: var(--ink);
      padding: 20px;
    }

    .phone {
      width: min(100%, 430px);
      height: min(820px, calc(100vh - 40px));
      min-height: 620px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      overflow: hidden;
      border: 1px solid rgba(0, 0, 0, .12);
      border-radius: 28px;
      background: var(--paper);
      box-shadow: 0 22px 70px rgba(21, 50, 45, .23);
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 20px;
      color: white;
      background: var(--green);
    }

    .avatar {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: white;
      color: var(--green);
      font-weight: 800;
    }

    header strong, header small { display: block; }
    header small { opacity: .8; margin-top: 2px; }

    .identity {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 12px 14px;
      background: rgba(255, 255, 255, .92);
      border-bottom: 1px solid rgba(0, 0, 0, .08);
    }

    label { font-size: 12px; color: #5d6872; }

    input, select {
      width: 100%;
      margin-top: 5px;
      padding: 10px 11px;
      border: 1px solid #d7dcdf;
      border-radius: 10px;
      font: inherit;
      outline: none;
    }

    input:focus, select:focus { border-color: var(--green-light); box-shadow: 0 0 0 3px rgba(37, 211, 102, .13); }
    .event-field { grid-column: 1 / -1; }

    .chat {
      overflow-y: auto;
      padding: 24px 16px;
      background-color: var(--paper);
      background-image: radial-gradient(rgba(7, 94, 84, .07) 1px, transparent 1px);
      background-size: 18px 18px;
    }

    .bubble {
      width: fit-content;
      max-width: 82%;
      margin: 8px 0;
      padding: 10px 12px 7px;
      border-radius: 12px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .12);
      line-height: 1.4;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .bubble.received { background: white; border-top-left-radius: 3px; }
    .bubble.sent { margin-left: auto; background: #d9fdd3; border-top-right-radius: 3px; }
    .bubble.error { background: #ffe1df; color: #8b1e18; }

    .meta {
      display: block;
      margin-top: 4px;
      text-align: right;
      color: #6d767d;
      font-size: 10px;
    }

    form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 9px;
      padding: 12px;
      background: #f4f6f7;
      border-top: 1px solid rgba(0, 0, 0, .08);
    }

    form input { margin: 0; border-radius: 22px; padding: 12px 16px; }

    .proof-form {
      display: none;
      grid-template-columns: 1fr auto;
      padding: 10px 12px;
      background: #fff8dc;
      border-top: 1px solid #eadb9e;
    }
    .proof-form.visible { display: grid; }
    .proof-form input { border-radius: 8px; padding: 9px; background: white; }
    .proof-form button { width: auto; height: auto; border-radius: 8px; padding: 9px 14px; font-size: 13px; }

    button {
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 50%;
      color: white;
      background: var(--green);
      font-size: 20px;
      cursor: pointer;
    }

    button:disabled { cursor: wait; opacity: .55; }

    @media (max-width: 520px) {
      body { padding: 0; }
      .phone { width: 100%; height: 100vh; min-height: 100vh; border: 0; border-radius: 0; }
      .identity { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="phone">
    <header>
      <div class="avatar">A</div>
      <div>
        <strong>Atendimento automático</strong>
        <small>n8n e API local ativos</small>
      </div>
    </header>

    <section class="identity" aria-label="Identificação">
      <label class="event-field">Evento
        <select id="evento"><option value="">Carregando eventos…</option></select>
      </label>
      <label>Seu nome
        <input id="nome" autocomplete="name" placeholder="Ex.: William" value="Pessoa de teste">
      </label>
      <label>Telefone
        <input id="telefone" inputmode="tel" autocomplete="tel" placeholder="5511999999999" value="5511999999999">
      </label>
    </section>

    <section class="chat" id="chat" aria-live="polite">
      <div class="bubble received">
        Olá! Envie uma mensagem para testar a automação local.
        <span class="meta">simulador</span>
      </div>
    </section>

    <form id="proof-form" class="proof-form">
      <input id="comprovante" type="file" accept="image/jpeg,image/png,application/pdf" required>
      <button type="submit">Enviar comprovante</button>
    </form>

    <form id="message-form">
      <input id="mensagem" maxlength="5000" autocomplete="off" placeholder="Digite uma mensagem" required>
      <button id="send-button" type="submit" aria-label="Enviar">➤</button>
    </form>
  </main>

  <script>
    const form = document.querySelector('#message-form');
    const chat = document.querySelector('#chat');
    const sendButton = document.querySelector('#send-button');
    const messageInput = document.querySelector('#mensagem');
    const eventSelect = document.querySelector('#evento');
    const proofForm = document.querySelector('#proof-form');
    const receiptInput = document.querySelector('#comprovante');
    let activeOrderId = null;
    const urlParameters = new URLSearchParams(window.location.search);
    const requestedEvent = urlParameters.get('evento');
    const contactOrigin = urlParameters.get('origem') || 'simulador_local';

    function addBubble(text, type, detail = '') {
      const bubble = document.createElement('div');
      bubble.className = `bubble ${type}`;
      bubble.textContent = text;
      if (detail) {
        const meta = document.createElement('span');
        meta.className = 'meta';
        meta.textContent = detail;
        bubble.append(meta);
      }
      chat.append(bubble);
      chat.scrollTop = chat.scrollHeight;
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, (character) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;',
      })[character]);
    }

    async function loadEvents() {
      const response = await fetch('/eventos?status=vendas_abertas');
      const result = await response.json();
      if (!response.ok) throw new Error(result.erro || 'Não foi possível carregar os eventos.');
      eventSelect.innerHTML = result.eventos.map((event) => (
        `<option value="${escapeHtml(event.codigo)}">${escapeHtml(event.nome)} — ${escapeHtml(event.data_evento)}</option>`
      )).join('');
      if (requestedEvent && result.eventos.some((event) => event.codigo === requestedEvent)) {
        eventSelect.value = requestedEvent;
      }
      if (!result.eventos.length) {
        eventSelect.innerHTML = '<option value="">Nenhum evento com vendas abertas</option>';
        sendButton.disabled = true;
        return;
      }
      await showSelectedEvent();
    }

    async function showSelectedEvent() {
      const eventCode = eventSelect.value;
      if (!eventCode) return;
      const response = await fetch(`/eventos/${encodeURIComponent(eventCode)}`);
      const result = await response.json();
      if (!response.ok) throw new Error(result.erro || 'Evento indisponível.');
      chat.innerHTML = '';
      const event = result.evento;
      const lot = result.lote_atual;
      const greeting = lot
        ? `${event.mensagem_boas_vindas || 'Olá!'}\n\n${event.nome}\nData: ${event.data_evento}${event.horario ? ` às ${event.horario}` : ''}\nLocal: ${event.local}\n${lot.nome}: R$ ${lot.valor}`
        : `${event.nome}\nNão existe lote disponível neste momento.`;
      addBubble(greeting, lot ? 'received' : 'error', 'informações atuais');
    }

    eventSelect.addEventListener('change', () => {
      showSelectedEvent().catch((error) => addBubble(error.message, 'error'));
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const nome = document.querySelector('#nome').value.trim();
      const telefone = document.querySelector('#telefone').value.trim();
      const mensagem = messageInput.value.trim();
      const evento_codigo = eventSelect.value;

      if (!evento_codigo || !nome || !telefone || !mensagem) {
        addBubble('Selecione o evento e preencha nome, telefone e mensagem.', 'error');
        return;
      }

      addBubble(mensagem, 'sent', 'enviando…');
      messageInput.value = '';
      sendButton.disabled = true;

      try {
        const response = await fetch('/simular-mensagem', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome, telefone, mensagem, evento_codigo, origem: contactOrigin }),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.erro || 'Não foi possível enviar.');
        addBubble(result.resposta || 'Mensagem recebida.', 'received', `registro #${result.id ?? '-'}`);
        if (result.pedido_id) activeOrderId = result.pedido_id;
        proofForm.classList.toggle('visible', result.estado === 'aguardando_pagamento');
      } catch (error) {
        addBubble(error.message, 'error', 'falha no envio');
      } finally {
        sendButton.disabled = false;
        messageInput.focus();
      }
    });

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result).split(',')[1]);
        reader.onerror = () => reject(new Error('Não foi possível ler o arquivo.'));
        reader.readAsDataURL(file);
      });
    }

    proofForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const file = receiptInput.files[0];
      const telefone = document.querySelector('#telefone').value.trim();
      if (!activeOrderId || !file) {
        addBubble('Selecione um comprovante para o pedido atual.', 'error');
        return;
      }
      if (file.size > 5_000_000) {
        addBubble('O comprovante deve possuir no máximo 5 MB.', 'error');
        return;
      }
      const button = proofForm.querySelector('button');
      button.disabled = true;
      try {
        const arquivo_base64 = await fileToBase64(file);
        const response = await fetch('/comprovantes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            pedido_id: activeOrderId,
            telefone,
            evento_codigo: eventSelect.value,
            nome_arquivo: file.name,
            tipo_mime: file.type,
            arquivo_base64,
          }),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.erro || 'Não foi possível enviar o comprovante.');
        addBubble(result.resposta, 'received', 'pagamento em análise');
        proofForm.classList.remove('visible');
        receiptInput.value = '';
      } catch (error) {
        addBubble(error.message, 'error', 'falha no comprovante');
      } finally { button.disabled = false; }
    });

    loadEvents().catch((error) => {
      eventSelect.innerHTML = '<option value="">Falha ao carregar</option>';
      sendButton.disabled = true;
      addBubble(error.message, 'error');
    });
  </script>
</body>
</html>
